<!doctype html>
<html lang="en" data-mode="advanced">
<head>
  <meta charset="utf-8" />
  <base href="../" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Timer — Rubik's Cube</title>
  <meta name="description" content="Speedcubing timer with WCA-style scrambles, 15 s inspection, +2/DNF and ao5 / ao12 / ao100 averages." />
  <meta name="author" content="Medeiros" />
  <meta name="theme-color" content="#0a1f44" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Speedcubing Timer — Rubik's Cube" />
  <meta property="og:description" content="Scrambles, inspection and ao5 / ao12 averages, right in your browser." />
  <meta property="og:image" content="https://smmezp.github.io/rubiks-cube/assets/og.png" />
  <meta property="og:url" content="https://smmezp.github.io/rubiks-cube/timer/" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <script>
    /* idioma e tema salvos antes de pintar */
    (function () {
      try {
        document.documentElement.lang = localStorage.getItem('medeiros-lang') === 'pt' ? 'pt-BR' : 'en';
        document.documentElement.dataset.mode = localStorage.getItem('cubo-mode') === 'basic' ? 'basic' : 'advanced';
        document.documentElement.classList.add('is-loading');
      } catch (e) { /* sem storage */ }
    })();
  </script>
  <link rel="expect" href="timer/#render-ready" blocking="render" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=202611211802" />
  <link rel="stylesheet" href="css/timer.css?v=202611211802" />
  <link rel="stylesheet" href="css/polish.css?v=202611211802" />
  <link rel="stylesheet" href="css/responsive.css?v=202611211802" />
  <link rel="stylesheet" href="css/timer-stats.css?v=202611211802" />
</head>
<body class="timer-page">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./" data-guide-link>
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="7" fill="currentColor"/>
          <g fill="#fff">
            <rect x="5" y="5" width="6.5" height="6.5" rx="1.6"/><rect x="12.75" y="5" width="6.5" height="6.5" rx="1.6" opacity=".85"/><rect x="20.5" y="5" width="6.5" height="6.5" rx="1.6"/>
            <rect x="5" y="12.75" width="6.5" height="6.5" rx="1.6" opacity=".85"/><rect x="12.75" y="12.75" width="6.5" height="6.5" rx="1.6"/><rect x="20.5" y="12.75" width="6.5" height="6.5" rx="1.6" opacity=".85"/>
            <rect x="5" y="20.5" width="6.5" height="6.5" rx="1.6"/><rect x="12.75" y="20.5" width="6.5" height="6.5" rx="1.6" opacity=".85"/><rect x="20.5" y="20.5" width="6.5" height="6.5" rx="1.6"/>
          </g>
        </svg>
        <span class="brand-text"><span data-i18n="brand.name">Rubik's Cube</span><small data-i18n="tm.brandSub">Timer</small></span>
      </a>

      <a class="back-link" href="./" data-guide-link data-i18n="tm.back">← Back to the guide</a>

      <div class="topbar-end">
        <div class="lang-switch" data-lang-active="en" role="group" data-i18n-aria="lang.label" aria-label="Language">
          <span class="lang-thumb" aria-hidden="true"></span>
          <button type="button" data-lang="en" class="is-active" aria-pressed="true" aria-label="English" title="English"><img class="flag" src="assets/flags/us.svg" alt="" width="22" height="22" decoding="async"></button>
          <button type="button" data-lang="pt" aria-pressed="false" aria-label="Português" title="Português"><img class="flag" src="assets/flags/br.svg" alt="" width="22" height="22" decoding="async"></button>
        </div>
      </div>
    </div>
  </header>

  <main class="tm">
    <!-- embaralhamento -->
    <section class="tm-scramble" aria-labelledby="tm-scr-label">
      <p class="tm-label" id="tm-scr-label" data-i18n="tm.scramble">Scramble</p>
      <p class="tm-scramble-text" id="tm-scramble" aria-live="polite"></p>
      <div class="tm-scr-actions">
        <button type="button" class="tm-btn" id="tm-prev" data-i18n-title="tm.prevTitle" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="tm.prev">Previous</span>
        </button>
        <button type="button" class="tm-btn" id="tm-next" data-i18n-title="tm.nextTitle">
          <span data-i18n="tm.next">New scramble</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </section>

    <!-- área do timer: segurar e soltar -->
    <section class="tm-stage" id="tm-pad" data-phase="idle" tabindex="0" data-i18n-aria="tm.padAria" aria-label="Timer">
      <p class="tm-pb" id="tm-pb" role="status" aria-live="polite" hidden></p>
      <output class="tm-time" id="tm-time">0.00</output>
      <p class="tm-status" id="tm-status"></p>
      <div class="tm-last" id="tm-last" hidden>
        <button type="button" data-pen="" class="tm-pen">OK</button>
        <button type="button" data-pen="+2" class="tm-pen">+2</button>
        <button type="button" data-pen="DNF" class="tm-pen">DNF</button>
        <button type="button" data-pen="del" class="tm-pen tm-pen-del" data-i18n-aria="tm.delete" aria-label="Delete">×</button>
      </div>
      <p class="tm-keys" data-i18n="tm.keys"></p>
    </section>

    <!-- gráfico de evolução -->
    <section class="tm-card tm-chart-card" aria-labelledby="tm-chart-title">
      <div class="tm-chart-head">
        <h2 id="tm-chart-title" data-i18n="tm.progress">Progress</h2>
        <ul class="tm-legend" aria-hidden="true">
          <li><i class="lg-single"></i><span data-i18n="tm.legendSingles">Single</span></li>
          <li><i class="lg-ao5"></i><span>ao5</span></li>
        </ul>
      </div>
      <div class="tm-chart" id="tm-chart"></div>
    </section>

    <!-- painel lateral -->
    <aside class="tm-side">
      <div class="tm-card tm-cube-card">
        <div class="tm-cube" id="tm-cube" aria-hidden="true"></div>
        <div class="tm-cube-info">
          <p class="tm-label" data-i18n="tm.preview">How it should look</p>
          <button type="button" class="tm-btn tm-btn-small" id="tm-watch" data-i18n="tm.watch">Watch it scramble</button>
        </div>
      </div>

      <div class="tm-card tm-options">
        <label class="tm-switch">
          <input type="checkbox" id="tm-inspection" />
          <span class="tm-switch-track" aria-hidden="true"></span>
          <span data-i18n="tm.inspection">15 s inspection</span>
        </label>
        <label class="tm-switch">
          <input type="checkbox" id="tm-hide" />
          <span class="tm-switch-track" aria-hidden="true"></span>
          <span data-i18n="tm.hideTime">Hide time while solving</span>
        </label>
      </div>

      <div class="tm-card">
        <table class="tm-stats-table">
          <thead><tr><th></th><th data-i18n="tm.current">Current</th><th data-i18n="tm.bestCol">Best</th></tr></thead>
          <tbody>
            <tr><th data-i18n="tm.single">Single</th><td id="st-last">—</td><td id="st-best">—</td></tr>
            <tr><th>ao5</th><td id="st-ao5">—</td><td id="st-bao5">—</td></tr>
            <tr><th>ao12</th><td id="st-ao12">—</td><td id="st-bao12">—</td></tr>
            <tr><th>ao100</th><td id="st-ao100">—</td><td id="st-bao100">—</td></tr>
          </tbody>
        </table>
        <p class="tm-summary"><span data-i18n="tm.mean">Mean</span> <b id="st-mean">—</b> · <span data-i18n="tm.solves">Solves</span> <b id="st-count">0</b></p>
      </div>

      <div class="tm-card tm-list-card">
        <div class="tm-session">
          <label class="sr-only" for="tm-session" data-i18n="tm.session">Session</label>
          <select id="tm-session" class="tm-select"></select>
          <button type="button" class="tm-icon-btn" id="tm-session-new" data-i18n-title="tm.newSession" data-i18n-aria="tm.newSession">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="tm-icon-btn" id="tm-session-rename" data-i18n-title="tm.rename" data-i18n-aria="tm.rename">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="tm-icon-btn" id="tm-session-delete" data-i18n-title="tm.deleteSession" data-i18n-aria="tm.deleteSession">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="tm-list-head">
          <h2 data-i18n="tm.times">Times</h2>
          <div class="tm-list-actions">
            <button type="button" class="tm-link" id="tm-export" data-i18n="tm.export">Export</button>
            <button type="button" class="tm-link" id="tm-clear" data-i18n="tm.clear">Clear all</button>
          </div>
        </div>
        <ol class="tm-list" id="tm-list"></ol>
      </div>
    </aside>

    <!-- detalhes de um tempo -->
    <dialog class="tm-dialog" id="tm-detail" aria-labelledby="tm-detail-title">
      <form method="dialog" class="tm-dialog-inner">
        <div class="tm-dialog-head">
          <h2 id="tm-detail-title"></h2>
          <button class="tm-icon-btn" value="close" data-i18n-aria="tm.close" aria-label="Close">×</button>
        </div>
        <p class="tm-detail-time" id="tm-detail-time"></p>
        <dl class="tm-detail-meta">
          <div><dt data-i18n="tm.date">Date</dt><dd id="tm-detail-date"></dd></div>
          <div><dt data-i18n="tm.ao5Here">ao5 here</dt><dd id="tm-detail-ao5"></dd></div>
        </dl>
        <p class="tm-label" data-i18n="tm.scramble">Scramble</p>
        <p class="tm-detail-scr" id="tm-detail-scr"></p>
        <div class="tm-dialog-actions">
          <button type="button" class="tm-pen" data-dpen="">OK</button>
          <button type="button" class="tm-pen" data-dpen="+2">+2</button>
          <button type="button" class="tm-pen" data-dpen="DNF">DNF</button>
          <button type="button" class="tm-btn tm-btn-small" id="tm-detail-copy" data-i18n="tm.copyScramble">Copy scramble</button>
          <button type="button" class="tm-btn tm-btn-small tm-danger" id="tm-detail-del" data-i18n="tm.delete">Delete</button>
        </div>
      </form>
    </dialog>
  </main>

  <footer class="footer tm-footer">
    <div class="footer-inner">
      <p class="copyright">© <span data-current-year>2026</span> <a href="https://smmezp.github.io/portfolio/" target="_blank" rel="noopener">Medeiros</a>. <span data-i18n="f.rights">All rights reserved.</span></p>
    </div>
  </footer>

  <script src="js/i18n.js?v=202611211802"></script>
  <script src="js/cube.js?v=202611211802"></script>
  <script src="js/cube3d.js?v=202611211802"></script>
  <script src="js/timer.js?v=202611211802"></script>
  <div id="render-ready" hidden></div>
</body>
</html>
